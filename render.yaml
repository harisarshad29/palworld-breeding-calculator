services:
  - type: web
    name: palworld-breeding-calculator
    runtime: rust
    plan: free
    buildCommand: cargo build --release --locked
    startCommand: ./target/release/palworld-breeding-calculator
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    domains:
      - www.palworld-breeding-calculator.us
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: BASE_URL
        value: https://www.palworld-breeding-calculator.us
      - key: RUST_VERSION
        value: 1.85.0

