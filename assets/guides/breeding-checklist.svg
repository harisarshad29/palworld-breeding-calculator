<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Plan a breeding pair</title><desc id="desc">Four checks: choose target, check available parents, verify requirements, calculate the outcome. Results predict species, not inherited traits.</desc><rect width="800" height="360" rx="24" fill="#131a23"/><text x="36" y="54" fill="#e5ecf4" font-family="Arial,sans-serif" font-size="26" font-weight="bold">Before you start breeding</text><g font-family="Arial,sans-serif" font-size="21" fill="#e5ecf4"><text x="50" y="116">1. Choose your target species</text><text x="50" y="172">2. Check which parents you own</text><text x="50" y="228">3. Verify pair and gender requirements</text><text x="50" y="284">4. Confirm the outcome in the calculator</text></g><path d="M32 100h5M32 156h5M32 212h5M32 268h5" stroke="#8ec8ff" stroke-width="5"/><text x="36" y="330" fill="#b6c8da" font-family="Arial,sans-serif" font-size="17">Species prediction only — check traits and game version separately.</text></svg>
